[project]
name = "cr10s"
version = "0.1.0"
description = "CR-10S Klipper upgrade: scripted design-to-print toolkit for Moonraker"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx",
]

[project.scripts]
cr10s-export = "cr10s.export:main"
cr10s-upload = "cr10s.upload:main"
cr10s-status = "cr10s.status:main"
cr10s-watch = "cr10s.watch:main"
cr10s-slice = "cr10s.slice:main"
cr10s-log-prune = "cr10s.prune:main"
cr10s-backup = "cr10s.backup:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-httpserver",
    "ruff",
    "pre-commit",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cr10s"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast tests, no network",
    "integration: tests against the fake Moonraker",
    "live: needs the real Pad, never prints (run with --live)",
]
