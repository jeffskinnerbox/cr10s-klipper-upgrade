<!doctype html>
<html>
<head><meta charset="utf-8"></head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: 'Inter', system-ui, sans-serif; }
    .disp { font-family: 'Space Grotesk', system-ui, sans-serif; }
    .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
  </style>
</helmet>
<div style="width:1040px; background:#fbfaf7; box-sizing:border-box; padding:32px 44px 26px; display:flex; flex-direction:column; gap:16px;">
  <div class="disp" style="font-size:26px; font-weight:700; color:#1e2230;">PSU &rarr; SKR V1.4 &rarr; Sonic Pad (power and host)</div>
  <div style="background:#fff; border:1px solid #dcd9d0; border-radius:16px; padding:28px 40px;">
    <svg viewBox="0 0 950 420" width="950" height="420" style="display:block; overflow:visible;">
      <!-- PSU -->
      <g>
        <rect x="20" y="60" width="160" height="300" rx="10" fill="#8a8f98" stroke="#5c6068" stroke-width="2"/>
        <text x="100" y="100" text-anchor="middle" class="disp" font-size="18" font-weight="700" fill="#fff">12 V PSU</text>
        <text x="100" y="124" text-anchor="middle" class="mono" font-size="12" fill="#e8e9ec">wall unplugged</text>
        <text x="168" y="145" text-anchor="end" class="mono" font-size="14" font-weight="600" fill="#fff">+V</text>
        <text x="168" y="265" text-anchor="end" class="mono" font-size="14" font-weight="600" fill="#fff">-V</text>
      </g>
      <!-- SKR -->
      <g>
        <rect x="370" y="30" width="250" height="360" rx="10" fill="#1f3a5f" stroke="#142840" stroke-width="2"/>
        <text x="495" y="64" text-anchor="middle" class="disp" font-size="18" font-weight="700" fill="#fff">SKR V1.4 Turbo</text>
        <rect x="445" y="150" width="100" height="100" rx="4" fill="#12161f"/>
        <text x="495" y="205" text-anchor="middle" class="mono" font-size="12" fill="#b8bcc6">LPC1769</text>
        <text x="384" y="115" class="mono" font-size="14" font-weight="600" fill="#fff">POWER +</text>
        <text x="384" y="175" class="mono" font-size="14" font-weight="600" fill="#fff">POWER -</text>
        <text x="384" y="255" class="mono" font-size="14" font-weight="600" fill="#fff">HB in +</text>
        <text x="384" y="315" class="mono" font-size="14" font-weight="600" fill="#fff">HB in -</text>
        <text x="606" y="205" text-anchor="end" class="mono" font-size="14" font-weight="600" fill="#fff">USB-B</text>
      </g>
      <!-- Pad -->
      <g>
        <rect x="780" y="140" width="150" height="130" rx="10" fill="#3b3f4a" stroke="#22252c" stroke-width="2"/>
        <text x="855" y="178" text-anchor="middle" class="disp" font-size="18" font-weight="700" fill="#fff">Sonic Pad</text>
        <text x="794" y="210" class="mono" font-size="14" font-weight="600" fill="#fff">USB1</text>
      </g>
      <!-- wires (drawn after components) -->
      <g fill="none" stroke-width="3.5" stroke-linecap="round">
        <path d="M180 140 C 280 140, 280 110, 370 110" stroke="#c0392b"/>
        <path d="M180 140 C 300 140, 280 250, 370 250" stroke="#c0392b" stroke-dasharray="9 6"/>
        <path d="M180 260 C 280 260, 280 170, 370 170" stroke="#222"/>
        <path d="M180 260 C 300 260, 280 310, 370 310" stroke="#222" stroke-dasharray="9 6"/>
        <path d="M620 205 C 700 205, 700 205, 780 205" stroke="#2563eb"/>
      </g>
      <g>
        <circle cx="180" cy="140" r="6" fill="#c0392b"/><circle cx="370" cy="110" r="6" fill="#c0392b"/><circle cx="370" cy="250" r="6" fill="#c0392b"/>
        <circle cx="180" cy="260" r="6" fill="#222"/><circle cx="370" cy="170" r="6" fill="#222"/><circle cx="370" cy="310" r="6" fill="#222"/>
        <circle cx="620" cy="205" r="6" fill="#2563eb"/><circle cx="780" cy="205" r="6" fill="#2563eb"/>
      </g>
    </svg>
  </div>
  <div style="display:flex; gap:26px; align-items:center; font-size:14px; color:#3a3f4c;">
    <span><span style="display:inline-block; width:26px; height:4px; background:#c0392b; vertical-align:middle;"></span> +12 V power</span>
    <span><span style="display:inline-block; width:26px; height:4px; background:#222; vertical-align:middle;"></span> ground</span>
    <span><span style="display:inline-block; width:26px; height:4px; background:#2563eb; vertical-align:middle;"></span> USB data</span>
    <span>dashed = bed input, verify terminal and current first</span>
  </div>
  <div style="font-size:13px; color:#6b7080;">Schematic, not to scale.</div>
</div>
</x-dc>
</body>
</html>
