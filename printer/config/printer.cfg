# Bench printer.cfg for the SKR V1.4 Turbo (task T033). One axis only: X.
# Standard Klipper sections only, so the config stays portable (Constitution III).
# Replace the serial id after flashing: ls /dev/serial/by-id/  (task T035).

[mcu]
# The Turbo shows up as lpc1769. A non-Turbo SKR shows up as lpc1768.
serial: /dev/serial/by-id/usb-Klipper_lpc1769_REPLACE

[printer]
kinematics: cartesian
max_velocity: 100
max_accel: 1000
max_z_velocity: 5
max_z_accel: 100

[stepper_x]
step_pin: P2.2
dir_pin: P2.6
enable_pin: !P2.1
microsteps: 16
rotation_distance: 40
# No endstop is wired on the bench. Pin and polarity are checked in the install phase.
endstop_pin: ^P1.29
position_endstop: 0
position_max: 300
homing_speed: 25

[tmc2209 stepper_x]
uart_pin: P1.10
run_current: 0.6

# Bench only: lets FORCE_MOVE turn a motor with no homing (phase-02 exit test).
# Remove this section in the full motion config (task T040).
[force_move]
enable_force_move: True
